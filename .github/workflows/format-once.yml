name: Format extracted source once

on:
  push:
    branches: [chore/repository-quality-audit-20261016]
    paths: [.github/workflows/format-once.yml]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/repository-quality-audit-20261016
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Format extracted frontend files
        run: |
          npm exec --yes --package=prettier@3.6.2 -- prettier --write assets/css/portfolio.css assets/js/portfolio.js assets/js/interface-sound.js
          git diff --check
      - name: Commit formatting to review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/css/portfolio.css assets/js/portfolio.js assets/js/interface-sound.js
          if ! git diff --cached --quiet; then
            git commit -m "Format extracted frontend source for maintenance"
            git push origin HEAD:chore/repository-quality-audit-20261016
          fi
