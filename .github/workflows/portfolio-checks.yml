name: Portfolio checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [chore/repository-quality-audit-20261016]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run check:syntax
